name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead. Paste error text as text, not as a screenshot.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest plugin or snippet that shows it. A change to examples/tauri-app is ideal.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      multiple: true
      options:
        - Node host (tauri-cordis/host)
        - Window client or slots (tauri-cordis/client)
        - Services
        - Rust crate (supervisor, Node download, host_service)
        - CLI or scaffolder
        - Manifest, market or review packages
        - Documentation or example
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: tauri-cordis version
      placeholder: 0.2.0
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS, Node version, Tauri version
      placeholder: Windows 11, Node 22.15, Tauri 2.9
    validations:
      required: true
