[package]
name = "notes-example"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Notes: a small Tauri app whose features are tauri-cordis plugins"

# Its own workspace, so the repository's root workspace (and its CI) never builds Tauri.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-cordis = { path = "../../../crates/tauri-cordis" }
ts-rs = "12"
