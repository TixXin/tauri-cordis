[package]
name = "tauri-cordis"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Everything-is-a-plugin supervisor and JSON-RPC host bridge for Tauri applications"
repository = "https://github.com/TixXin/tauri-cordis"
homepage = "https://github.com/TixXin/tauri-cordis"
readme = "README.md"
keywords = ["tauri", "plugin", "cordis", "json-rpc", "webview"]
categories = ["gui", "development-tools"]

[dependencies]
inventory = "0.3"
pollster = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
serde = "1"
serde_json = "1"
sha2 = "0.10"
tauri-cordis-macros = { version = "0.3.0", path = "../tauri-cordis-macros" }
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
