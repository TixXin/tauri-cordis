[package]
name = "tauri-cordis-macros"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Procedural macro #[host_service] that exposes Rust functions to the tauri-cordis Node plugin host"
repository = "https://github.com/TixXin/tauri-cordis"
homepage = "https://github.com/TixXin/tauri-cordis"
readme = "README.md"
keywords = ["tauri", "plugin", "cordis", "json-rpc", "macros"]
categories = ["gui", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
